# Copy this file to config.toml and fill in every CHANGEME value.
# Do not commit config.toml. It holds passwords and API keys.

[lidarr]
url = "http://127.0.0.1:8686"
# Quotes are required. An unquoted hex API key will fail to parse.
api_key = "CHANGEME"
# Path Lidarr itself uses when it scans the completed folder.
# If Lidarr runs as a Windows service on this same PC, this is the same
# as [paths].complete_dir below.
scan_path = "D:\\Media\\Incoming\\Soulseek"

[soulseek]
username = "CHANGEME"
password = "CHANGEME"
listen_port = 2234
obfuscated_port = 2235
enable_upnp = true

[paths]
# Incomplete + raw Soulseek downloads land here first.
download_dir = "D:\\Media\\Incoming\\Soulseek-raw"
# Clean album folders Lidarr should import from.
complete_dir = "D:\\Media\\Incoming\\Soulseek"
# Optional: share part of your library so you are not only downloading.
# Leave empty to share nothing. Sharing at least something is recommended.
share_dir = ""
state_db = "state.sqlite3"
log_file = "lidarr-soulseek.log"

[search]
search_wait_seconds = 12
max_albums_per_cycle = 3
# After album grabs, search Soulseek for individual missing tracks on partial albums.
fill_missing_tracks = true
max_tracks_per_cycle = 5
cycle_seconds = 300
retry_hours = 12
min_filename_ratio = 0.5
track_count_tolerance = 2
# Tried in order. MP3 folders win when both exist; FLAC/WAV are allowed as fallback.
preferred_extensions = ["mp3", "flac", "wav"]
min_mp3_bitrate = 320
# Convert lossless downloads to MP3 before Lidarr import. Requires ffmpeg on PATH.
convert_to_mp3 = true
convert_bitrate = 320
# Delete the original FLAC/WAV in Incomplete after Lidarr is asked to import the MP3.
delete_sources_after_import = true
ignored_users = []

[runtime]
# Process this many albums at once. Keep at 1 until you know it is stable.
concurrent_albums = 1
download_timeout_minutes = 90
